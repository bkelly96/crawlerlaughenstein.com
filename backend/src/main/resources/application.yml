spring:
  application:
    name: api
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:crawler}
    username: ${POSTGRES_USER:crawler}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
